# Sveltia CMS config. Every save is a commit to main, which triggers
# .github/workflows/deploy.yml and goes live in ~2 minutes.
# Sign in with a fine-grained GitHub token: this repo only, "Contents: Read and write".
app_title: Portfolio Admin
logo:
  src: /icons/icon-192.png
site_url: https://ahmedmalmoselhy.github.io

backend:
  name: github
  repo: ahmedmalmoselhy/ahmedmalmoselhy.github.io
  branch: main

media_folder: public
public_folder: /

# The live preview pane only shows raw JSON fields here, so give the form the full width
editor:
  preview: false

output:
  omit_empty_optional_fields: true
  json:
    indent_style: space
    indent_size: 2

# One-off pages: open straight from the sidebar
singletons:
  - name: site
    label: Profile & contact
    icon: person
    file: src/content/site.json
    format: json
    fields:
      - { name: name, label: Full name, widget: string }
      - { name: handle, label: Handle, widget: string, hint: "Shown as ~/handle in the header and footer" }
      - { name: avatar, label: Profile picture, widget: image }
      - { name: resume, label: CV (PDF), widget: file }
      - { name: email, label: Email, widget: string }
      - { name: phone, label: Phone, widget: string, hint: "Used for call links, e.g. +201117001262" }
      - { name: phoneDisplay, label: Phone as displayed, widget: string, hint: "e.g. +20 111 700 1262" }
      - name: whatsapp
        label: WhatsApp number
        widget: string
        hint: "Digits only, with country code. Changing it does **not** update the QR code image on the contact page."
      - { name: github, label: GitHub username, widget: string }
      - { name: linkedin, label: LinkedIn username, widget: string }
      - name: availability
        label: Availability
        widget: object
        fields:
          - { name: available, label: Available for work, widget: boolean, hint: "Turn off to hide the green status dot and both status lines" }
          - { name: headline, label: Home page status, widget: string }
          - { name: status, label: Contact page status, widget: string }
          - name: openTo
            label: "'Available for' cards (contact page)"
            label_singular: card
            widget: list
            collapsed: true
            summary: "{{title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: string }
              - &icon
                name: icon
                label: Icon
                widget: select
                # Keep in sync with src/lib/icons.ts
                options: [Brain, Briefcase, Building2, ChartColumn, Clock, Code, Handshake, Heart, Lightbulb, MessageSquare, Palette, Rocket, Star, Users]

  - name: home
    label: Home page
    icon: home
    file: src/content/home.json
    format: json
    fields:
      - name: buildPhrases
        label: Hero rotating phrases
        hint: "Completes the sentence 'I build and run …'"
        widget: list
        field: { name: item, label: Phrase, widget: string }
      - name: shipped
        label: Things I've shipped
        label_singular: item
        widget: list
        collapsed: true
        summary: "{{title}}"
        thumbnail: image
        fields:
          - { name: title, label: Title, widget: string }
          - { name: kicker, label: Stack label, widget: string, hint: "Small text above the title, e.g. laravel · filament · pwa" }
          - { name: text, label: Text, widget: text }
          - { name: footer, label: Footer, widget: string, hint: "e.g. shipped · 2026" }
          - { name: domain, label: Colour, widget: select, options: [{ label: Telecom (blue), value: tel }, { label: CRM (teal), value: crm }, { label: Web (orange), value: web }] }
          - name: image
            label: Screenshot
            widget: image
            required: false
            media_folder: /public/projects-images
            public_folder: /projects-images
          - &logo
            name: logo
            label: Logo
            widget: image
            required: false
            media_folder: /public/logos
            public_folder: /logos
          - name: projectId
            label: Opens project
            widget: relation
            collection: projects
            value_field: id
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "Leave empty to link to the resume instead"
      - name: onMyDesk
        label: On my desk
        label_singular: item
        widget: list
        collapsed: true
        summary: "{{title}} · {{status}}"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: status, label: Status, widget: string, hint: "e.g. ongoing, building, slowly" }
          - { name: pace, label: Status dot, widget: select, options: [{ label: Green (active), value: live }, { label: Amber (slow), value: slow }] }
          - { name: meta, label: Meta, widget: string }
      - name: changelog
        label: Changelog
        label_singular: entry
        widget: list
        collapsed: true
        summary: "{{date}} · {{text}}"
        fields:
          - { name: date, label: Date, widget: string, hint: "e.g. 2026-09 or 2026" }
          - { name: text, label: Text, widget: string }
          - { name: kind, label: Kind, widget: select, options: [{ label: Shipped, value: ship }, { label: Certificate, value: cert }, { label: Work, value: work }] }
      - name: stack
        label: Stack
        label_singular: group
        widget: list
        collapsed: true
        summary: "{{group}}"
        fields:
          - { name: group, label: Group, widget: string }
          - name: items
            label: Items
            widget: list
            field: { name: item, label: Item, widget: string }
      - name: ticker
        label: Scrolling ticker
        widget: list
        field: { name: item, label: Item, widget: string }
      - name: offTheClock
        label: Off the clock
        label_singular: item
        widget: list
        collapsed: true
        summary: "{{emoji}} {{title}}"
        fields:
          - { name: emoji, label: Emoji, widget: string }
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: string }

  - name: skills
    label: Skills
    icon: psychology
    file: src/content/skills.json
    format: json
    fields:
      - name: categories
        label: Skill categories
        label_singular: category
        widget: list
        collapsed: true
        summary: "{{name}}"
        fields:
          - { name: name, label: Category, widget: string }
          - name: skills
            label: Skills
            label_singular: skill
            widget: list
            summary: "{{name}} · {{level}}%"
            fields:
              - { name: name, label: Skill, widget: string }
              - { name: level, label: Level (%), widget: number, value_type: int, min: 0, max: 100 }
          - name: color
            label: Colour
            widget: select
            options:
              - { label: Blue, value: portfolio-highlight }
              - { label: Blue (alt), value: portfolio-blue }
              - { label: Teal, value: portfolio-teal }
              - { label: Orange, value: portfolio-slate }
              - { label: Amber, value: portfolio-lightSlate }
      - name: softSkills
        label: Soft skills
        label_singular: soft skill
        widget: list
        collapsed: true
        summary: "{{name}}"
        fields:
          - { name: name, label: Skill, widget: string }
          - *icon

  - name: personal
    label: Resume extras
    icon: badge
    file: src/content/personal.json
    format: json
    fields:
      - name: skillsOverview
        label: Skills overview
        widget: list
        field: { name: item, label: Skill, widget: string }
      - name: languages
        label: Languages
        label_singular: language
        widget: list
        summary: "{{name}} · {{level}}"
        fields:
          - { name: name, label: Language, widget: string }
          - { name: level, label: Level, widget: string }
      - name: personalDetails
        label: Personal details
        label_singular: detail
        widget: list
        summary: "{{label}}: {{value}}"
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      - name: interests
        label: Interests
        widget: list
        field: { name: item, label: Interest, widget: string }

# Lists of things: one file per entry, with search, thumbnails and drag-to-reorder
collections:
  - name: projects
    label: Projects
    label_singular: Project
    icon: code
    folder: src/content/projects
    format: json
    identifier_field: title
    summary: "{{title}}"
    reorder: true
    thumbnail: image
    sortable_fields: [title, date, status]
    view_filters:
      - { label: In progress, field: status, pattern: in-progress }
      - { label: Completed, field: status, pattern: completed }
      - { label: Commercial, field: monetized, pattern: true }
      - { label: Company work, field: kind, pattern: company }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: id, label: Project number, widget: number, value_type: int, hint: "Used in the page link (#/projects/7). Must be unique: use the highest existing number + 1." }
      - name: kind
        label: Type
        widget: select
        default: personal
        required: false
        hint: "Shown as a label on the Projects page. For Company, also fill in the company fields at the bottom."
        options:
          - { label: Personal, value: personal }
          - { label: Client work, value: client }
          - { label: Service, value: service }
          - { label: Company, value: company }
      - name: status
        label: Status
        widget: select
        options:
          - { label: Completed, value: completed }
          - { label: In progress, value: in-progress }
          - { label: On hold, value: on-hold }
          - { label: New, value: new }
          - { label: Planned, value: planned }
          - { label: Archived, value: archived }
          - { label: Canceled, value: canceled }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
      - name: image
        label: Cover image
        widget: image
        required: false
        media_folder: /public/projects-images
        public_folder: /projects-images
        hint: "Leave empty to get a generated cover: icon, title, company and client logos, and Creatio / Ericsson marks from the technologies list."
      - name: coverIcon
        label: Cover icon
        widget: select
        required: false
        hint: "Icon on the generated cover. Empty picks one from the project type."
        options:
          - { label: Code, value: code }
          - { label: Dashboard, value: dashboard }
          - { label: Pipeline / order flow, value: pipeline }
          - { label: Funnel to revenue, value: funnel }
          - { label: Contract, value: contract }
          - { label: People / customers, value: people }
          - { label: Workload bars, value: workload }
          - { label: Capsule / health, value: capsule }
          - { label: Box / product, value: box }
          - { label: Handshake / client, value: handshake }
          - { label: Building / company, value: building }
      - { name: coverSubtitle, label: Cover subtitle, widget: string, required: false, hint: "Line under the title on the generated cover. Empty uses 'for <client>' or 'at <company>'." }
      - name: media
        label: Gallery
        label_singular: media item
        hint: "Extra screenshots and videos shown on the project page. Prefer YouTube for long videos: uploaded files go into the repo."
        widget: list
        required: false
        collapsed: true
        summary: "{{type}} · {{caption}}"
        types:
          - name: image
            label: Screenshot
            widget: object
            summary: "{{caption}}"
            fields:
              - { name: src, label: Image, widget: image, media_folder: /public/projects-media, public_folder: /projects-media }
              - { name: caption, label: Caption, widget: string, required: false }
          - name: youtube
            label: YouTube video
            widget: object
            summary: "{{caption}}"
            fields:
              - { name: url, label: YouTube link, widget: string, hint: "Any link: youtube.com/watch?v=…, youtu.be/…, or /shorts/…" }
              - { name: caption, label: Caption, widget: string, required: false }
          - name: video
            label: Video file
            widget: object
            summary: "{{caption}}"
            fields:
              - { name: src, label: Video, widget: file, accept: "video/*,.mp4,.webm,.mov,.m4v", media_folder: /public/projects-media, public_folder: /projects-media, hint: "MP4 plays everywhere; WebM and MOV may not play in every browser. Keep it small (under ~20 MB)." }
              - { name: caption, label: Caption, widget: string, required: false }
      - { name: description, label: Short description, widget: text, hint: "One sentence, shown on the project card" }
      - { name: extendedDescription, label: Full description, widget: text, hint: "Shown on the project page" }
      - name: technologies
        label: Technologies
        widget: list
        field: { name: item, label: Technology, widget: string }
      - { name: githubUrl, label: GitHub URL, widget: string, required: false }
      - { name: liveUrl, label: Live URL, widget: string, required: false }
      - { name: demo, label: Demo available, widget: boolean, default: true }
      - { name: monetized, label: Commercial product, widget: boolean, required: false, hint: "Shows a 'request a demo' button instead of source links" }
      - name: company
        label: Company
        widget: relation
        collection: experience
        value_field: company
        search_fields: [company]
        required: false
        hint: "For company projects: the employer. The project then also shows on that company's page."
      - { name: client, label: Client, widget: string, required: false, hint: "The customer, for company or client work. Leave empty for internal projects." }
      - name: logo
        label: Client logo
        widget: image
        required: false
        media_folder: /public/logos
        public_folder: /logos
        hint: "Shown in the top-right corner of the generated cover"
      - { name: role, label: Role, widget: string, required: false }
      - { name: period, label: Period, widget: string, required: false }
      - { name: workType, label: Work type, widget: string, required: false }
      - { name: location, label: Location, widget: string, required: false }
      - name: highlights
        label: What I did
        widget: list
        required: false
        hint: "Bullets shown on the project page and the company page"
        field: { name: item, label: Highlight, widget: string }

  - divider: true

  - name: experience
    label: Experience
    label_singular: Employer
    icon: work
    folder: src/content/experience
    format: json
    identifier_field: company
    summary: "{{company}} · {{period}}"
    reorder: true
    thumbnail: logo
    fields:
      - { name: company, label: Company, widget: string }
      - *logo
      - { name: period, label: Period, widget: string, hint: "e.g. December 2022 - Present" }
      - { name: workType, label: Work type, widget: string, hint: "e.g. Full-time Hybrid" }
      - { name: location, label: Location, widget: string }
      - { name: link, label: Website, widget: string, required: false }
      - { name: overview, label: Overview, widget: text, required: false, hint: "Intro paragraph at the top of this company's page" }
      - name: roles
        label: Roles
        label_singular: role
        widget: list
        collapsed: true
        summary: "{{title}} · {{period}}"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: period, label: Period, widget: string }
          - { name: details, label: Details, widget: text, required: false, hint: "Longer write-up shown on the company page; the resume shows only the bullets" }
          - name: responsibilities
            label: Responsibilities
            widget: list
            field: { name: item, label: Responsibility, widget: string }
      - name: achievements
        label: Achievements
        widget: list
        required: false
        field: { name: item, label: Achievement, widget: string }
      - name: technologies
        label: Technologies
        widget: list
        required: false
        field: { name: item, label: Technology, widget: string }

  - name: certifications
    label: Certifications
    label_singular: Certificate
    icon: verified
    folder: src/content/certifications
    format: json
    identifier_field: name
    summary: "{{name}} · {{year}}"
    reorder: true
    thumbnail: [image, logo]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: issuer, label: Issuer, widget: string }
      - { name: year, label: Date, widget: string, hint: "Month and year from the certificate, e.g. Oct 2026" }
      - name: image
        label: Certificate image
        widget: image
        required: false
        media_folder: /public/certificates
        public_folder: /certificates
      - name: logo
        label: Issuer logo
        widget: image
        required: false
        media_folder: /public/logos
        public_folder: /logos
      - name: employer
        label: Earned while working at
        widget: relation
        collection: experience
        value_field: company
        search_fields: [company]
        required: false
        hint: "Shows the certificate under that employer on the resume"
      - { name: id, label: ID, widget: uuid, use_b32_encoding: true }

  - name: education
    label: Education
    label_singular: Degree
    icon: school
    folder: src/content/education
    format: json
    identifier_field: degree
    summary: "{{degree}} · {{institution}}"
    reorder: true
    thumbnail: logo
    fields:
      - { name: degree, label: Degree, widget: string }
      - { name: institution, label: Institution, widget: string }
      - { name: period, label: Period, widget: string, hint: "e.g. 2014 - 2020" }
      - *logo
      - { name: description, label: Description, widget: text }
      - { name: id, label: ID, widget: uuid, use_b32_encoding: true }

  - name: training
    label: Training
    label_singular: Course
    icon: menu_book
    folder: src/content/training
    format: json
    identifier_field: name
    summary: "{{name}} · {{year}}"
    reorder: true
    thumbnail: logo
    fields:
      - { name: name, label: Name, widget: string }
      - { name: provider, label: Provider, widget: string }
      - { name: year, label: Year, widget: string }
      - *logo
      - { name: description, label: Description, widget: text, required: false }
      - { name: id, label: ID, widget: uuid, use_b32_encoding: true }
